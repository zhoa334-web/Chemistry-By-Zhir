<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbital Atlas — Periodic Table</title>
<meta name="theme-color" content="#04050d">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --void: #04050d;
    --ink: #e8ecff;
    --ink-dim: rgba(232, 236, 255, .58);
    --hairline: rgba(255, 255, 255, .1);
    --tile: 56px;
    --gap: 4px;
    --c: #4dabf7;
    --face: 'Sora', 'Noto Sans Arabic', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  html[lang="ckb"] { --face: 'Noto Sans Arabic', 'Sora', system-ui, sans-serif; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: var(--face);
    color: var(--ink);
    background:
      radial-gradient(1100px 700px at 78% 8%, rgba(88, 101, 242, .20), transparent 62%),
      radial-gradient(900px 620px at 8% 92%, rgba(20, 184, 166, .13), transparent 60%),
      var(--void);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid #7dd3fc; outline-offset: 2px; }

  /* ---- webgl layer ---- */
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

  /* ---- header chrome ---- */
  #chrome {
    position: fixed; inset: 0 0 auto 0; z-index: 30; height: 64px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 max(16px, env(safe-area-inset-left));
    pointer-events: none;
  }
  #chrome > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark { width: 26px; height: 26px; flex: none; }
  .brand b { font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
  .brand small { color: var(--ink-dim); font-size: 12px; white-space: nowrap; }
  @media (max-width: 720px) { .brand small { display: none; } }

  .tools { display: flex; align-items: center; gap: 10px; }
  #tableChrome { display: flex; align-items: center; gap: 10px; visibility: hidden; opacity: 0; }

  .field {
    display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
    border-radius: 999px; border: 1px solid var(--hairline);
    background: rgba(255, 255, 255, .04); backdrop-filter: blur(10px);
  }
  .field input {
    width: 150px; background: transparent; border: 0; outline: 0; color: var(--ink);
    font: 400 13px var(--face);
  }
  .field input::placeholder { color: var(--ink-dim); }
  .field:focus-within { border-color: rgba(125, 211, 252, .6); box-shadow: 0 0 0 3px rgba(125, 211, 252, .12); }
  @media (max-width: 720px) { .field input { width: 92px; } }

  .ghost-btn {
    height: 36px; padding: 0 14px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--hairline); background: rgba(255, 255, 255, .04);
    backdrop-filter: blur(10px); transition: background .25s, border-color .25s;
    white-space: nowrap;
  }
  .ghost-btn:hover { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .25); }
  @media (max-width: 720px) { .ghost-btn span { display: none; } .ghost-btn { padding: 0 11px; } }

  /* language switch: thumb slides on [data-lang] of the track */
  .lang {
    position: relative; display: grid; grid-template-columns: 1fr 1fr; height: 36px; padding: 3px;
    border-radius: 999px; border: 1px solid var(--hairline);
    background: rgba(255, 255, 255, .04); backdrop-filter: blur(10px); direction: ltr;
  }
  .lang::before {
    content: ''; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
    border-radius: 999px; background: linear-gradient(135deg, #38bdf8, #8b5cf6);
    box-shadow: 0 0 18px -2px rgba(139, 92, 246, .7);
    transition: transform .45s cubic-bezier(.2, .9, .2, 1);
  }
  .lang[data-lang="ku"]::before { transform: translateX(100%); }
  .lang button { position: relative; z-index: 1; padding: 0 14px; font-size: 12.5px; font-weight: 600; color: var(--ink-dim); transition: color .3s; }
  .lang button[aria-pressed="true"] { color: #fff; }

  /* ---- globe call-to-action ---- */
  #hint {
    position: fixed; left: 0; right: 0; bottom: 72px; z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
    padding: 0 20px; pointer-events: none;
  }
  #hint p { margin: 0; font-size: 13px; color: var(--ink-dim); max-width: 36ch; line-height: 1.6; }
  #expandBtn {
    pointer-events: auto; position: relative; height: 46px; padding: 0 26px; border-radius: 999px;
    font-weight: 600; font-size: 14px; color: #fff;
    background: linear-gradient(135deg, rgba(56, 189, 248, .28), rgba(139, 92, 246, .32));
    border: 1px solid rgba(165, 180, 252, .45); backdrop-filter: blur(12px);
    transition: transform .3s cubic-bezier(.2, .9, .2, 1), box-shadow .3s;
  }
  #expandBtn::after {
    content: ''; position: absolute; inset: -1px; border-radius: inherit;
    border: 1px solid rgba(125, 211, 252, .6); animation: ping 2.8s ease-out infinite;
  }
  #expandBtn:hover { transform: translateY(-2px); box-shadow: 0 10px 40px -8px rgba(139, 92, 246, .8); }
  @keyframes ping { 0% { transform: scale(1); opacity: .8; } 80%, 100% { transform: scale(1.28, 1.7); opacity: 0; } }

  /* ---- table stage ---- */
  #stage {
    position: fixed; inset: 0; z-index: 10; overflow: auto; padding: 72px 16px 56px;
    display: flex; flex-direction: column; pointer-events: none; direction: ltr;
    scrollbar-width: thin;
  }
  #stageInner { margin: auto; width: max-content; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  #atlasGrid {
    position: relative; display: grid; gap: var(--gap);
    grid-template-columns: repeat(18, var(--tile));
    grid-template-rows: repeat(7, var(--tile)) calc(var(--tile) * .3) repeat(2, var(--tile));
  }

  .tile {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    padding: 0; border-radius: calc(var(--tile) * .13); pointer-events: auto;
    border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 22%, rgba(10, 14, 30, .55)), rgba(8, 10, 24, .5));
    backdrop-filter: blur(5px);
    visibility: hidden; opacity: 0;
    transition: box-shadow .25s, border-color .25s, filter .35s, scale .22s cubic-bezier(.2, .9, .2, 1);
    will-change: transform;
  }
  .tile:hover, .tile:focus-visible {
    z-index: 5; scale: 1.16; border-color: var(--c);
    box-shadow: 0 0 0 1px var(--c), 0 0 30px -4px var(--c);
  }
  .tz { position: absolute; top: 3px; left: 5px; font: 500 calc(var(--tile) * .16)/1 var(--mono); opacity: .62; }
  .ts { font-size: calc(var(--tile) * .38); font-weight: 700; line-height: 1; letter-spacing: -.01em; }
  .tn { font-size: calc(var(--tile) * .15); opacity: .72; max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #atlasGrid.compact .tn { display: none; }
  .tile.is-miss, #atlasGrid[data-focus] .tile.is-dim { filter: grayscale(1) brightness(.4); }

  #legend {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 8px; max-width: calc(18 * var(--tile) + 17 * var(--gap));
    visibility: hidden; opacity: 0; pointer-events: auto;
  }
  .swatch {
    display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 999px;
    font-size: 11.5px; border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
    background: color-mix(in srgb, var(--c) 10%, transparent); transition: background .25s, box-shadow .25s;
  }
  .swatch i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .swatch:hover, .swatch:focus-visible { background: color-mix(in srgb, var(--c) 26%, transparent); box-shadow: 0 0 18px -4px var(--c); }

  /* ---- dossier (modal) ---- */
  @property --sweep { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  #dossier { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 12px; }
  #dossier.hidden { display: none; }
  #veil { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, rgba(6, 8, 22, .55), rgba(2, 3, 10, .9)); backdrop-filter: blur(10px) saturate(120%); }
  #dossierCard {
    position: relative; width: min(940px, 100%); max-height: 94vh; border-radius: 28px; overflow: hidden;
    background: linear-gradient(150deg, rgba(22, 28, 56, .74), rgba(8, 10, 24, .82));
    backdrop-filter: blur(24px) saturate(150%);
    border: 1px solid color-mix(in srgb, var(--c) 30%, rgba(255, 255, 255, .08));
    box-shadow: 0 40px 120px -30px rgba(0, 0, 0, .9), 0 0 90px -28px var(--c), inset 0 1px 0 rgba(255, 255, 255, .08);
  }
  #dossierCard::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--sweep), transparent 0 68%, var(--c) 84%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: sweep 7s linear infinite;
  }
  @keyframes sweep { to { --sweep: 360deg; } }
  .dz-scroll { max-height: 94vh; overflow: auto; scrollbar-width: thin; }
  .dz-cols { display: grid; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 800px) { .dz-cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); } }
  .dz-left { position: relative; padding: 24px; border-block-end: 1px solid var(--hairline); }
  @media (min-width: 800px) { .dz-left { border-block-end: 0; border-inline-end: 1px solid var(--hairline); padding: 30px; } }
  .dz-right { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  @media (min-width: 800px) { .dz-right { padding: 30px; } }

  #dzSym { margin: 0; font-size: clamp(64px, 11vw, 100px); line-height: .95; font-weight: 700; letter-spacing: -.03em;
    background: linear-gradient(180deg, #fff, color-mix(in srgb, var(--c) 70%, #fff)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px color-mix(in srgb, var(--c) 55%, transparent)); direction: ltr; text-align: start; }
  #dzNum { font: 500 13px var(--mono); color: var(--ink-dim); }
  #dzName { margin: 4px 0 10px; font-size: 24px; font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12px;
    border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 16%, transparent);
  }
  .chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }

  .atom-wrap {
    position: relative; margin-top: 16px; aspect-ratio: 1; width: 100%; border-radius: 22px; overflow: hidden;
    background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--c) 14%, transparent), rgba(4, 5, 13, .55) 70%);
    border: 1px solid var(--hairline);
  }
  #atomCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tally { display: flex; justify-content: space-between; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; }
  .tally li { flex: 1; display: flex; flex-direction: column; gap: 3px; padding: 9px 11px; border-radius: 14px; background: rgba(255, 255, 255, .04); border: 1px solid var(--hairline); font-size: 11.5px; color: var(--ink-dim); }
  .tally b { font: 600 19px var(--mono); color: var(--ink); display: flex; align-items: center; gap: 7px; }
  .tally i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  #dzStats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin: 0; }
  .stat { padding: 11px 13px; border-radius: 16px; background: rgba(255, 255, 255, .04); border: 1px solid var(--hairline); min-width: 0; }
  .stat dt { font-size: 11.5px; color: var(--ink-dim); margin-bottom: 4px; }
  .stat dd { margin: 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .block { padding: 13px 15px; border-radius: 16px; background: rgba(255, 255, 255, .04); border: 1px solid var(--hairline); }
  .block h3 { margin: 0 0 7px; font-size: 11.5px; font-weight: 400; color: var(--ink-dim); }
  #dzConfig { font: 500 16px/1.6 var(--mono); color: color-mix(in srgb, var(--c) 40%, #fff); direction: ltr; unicode-bidi: isolate; display: block; text-align: start; }
  #dzHistory { margin: 0; font-size: 14px; line-height: 1.75; }
  .dz-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 4px; }
  .icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--hairline); background: rgba(255, 255, 255, .05); transition: background .25s, transform .25s; }
  .icon-btn:hover { background: rgba(255, 255, 255, .14); transform: scale(1.07); }
  #dzClose { position: absolute; top: 14px; inset-inline-end: 14px; z-index: 3; }
  html[dir="rtl"] .flip-rtl { transform: scaleX(-1); }

  /* ---- watermark ---- */
  .mark {
    position: fixed; right: 14px; bottom: 10px; z-index: 70; padding: 6px 9px; border-radius: 8px;
    font: 500 11px/1 var(--mono); letter-spacing: .12em; color: rgba(255, 255, 255, .32);
    user-select: none; transition: color .4s, letter-spacing .5s cubic-bezier(.2, .9, .2, 1), background .4s, text-shadow .4s;
  }
  .mark b { position: relative; font-weight: 600; color: rgba(255, 255, 255, .52); }
  .mark b::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px;
    background: linear-gradient(90deg, #7dd3fc, #c084fc); transform: scaleX(0); transform-origin: left;
    transition: transform .5s cubic-bezier(.2, .9, .2, 1);
  }
  .mark:hover { color: rgba(255, 255, 255, .88); letter-spacing: .2em; background: rgba(255, 255, 255, .04); text-shadow: 0 0 16px rgba(125, 211, 252, .55); }
  .mark:hover b { color: #fff; }
  .mark:hover b::after { transform: scaleX(1); }

  #fallback { position: fixed; inset: 0; z-index: 99; display: none; place-items: center; text-align: center; padding: 24px; background: var(--void); }

  @media (prefers-reduced-motion: reduce) {
    #dossierCard::before, #expandBtn::after { animation: none; }
  }
</style>
</head>

<body data-phase="globe">
  <canvas id="gl" aria-label="Interactive particle globe"></canvas>

  <header id="chrome">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="3.2" fill="#7dd3fc"/>
        <ellipse cx="16" cy="16" rx="13" ry="5.2" stroke="#a78bfa" stroke-width="1.2"/>
        <ellipse cx="16" cy="16" rx="13" ry="5.2" stroke="#38bdf8" stroke-width="1.2" transform="rotate(60 16 16)"/>
        <ellipse cx="16" cy="16" rx="13" ry="5.2" stroke="#f472b6" stroke-width="1.2" transform="rotate(120 16 16)"/>
      </svg>
      <div>
        <b>Orbital Atlas</b><br>
        <small data-t="tagline">Periodic Table of the Elements</small>
      </div>
    </div>

    <div class="tools">
      <div id="tableChrome">
        <label class="field">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" autocomplete="off" spellcheck="false" data-tp="search" placeholder="Search element…">
        </label>
        <button id="foldBtn" class="ghost-btn" type="button" title="Back to sphere">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:inline;vertical-align:-2px"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
          <span data-t="fold">Back to sphere</span>
        </button>
      </div>
      <div class="lang" id="langSwitch" data-lang="en" role="group" aria-label="Language">
        <button type="button" data-set="en" aria-pressed="true">English</button>
        <button type="button" data-set="ku" aria-pressed="false">Kurdî</button>
      </div>
    </div>
  </header>

  <div id="hint">
    <button id="expandBtn" type="button" data-t="expand">Expand Elements</button>
    <p data-t="hint">Drag to rotate, then tap the sphere to unfold the elements.</p>
  </div>

  <main id="stage" aria-label="Periodic table">
    <div id="stageInner">
      <div id="atlasGrid" dir="ltr"></div>
      <div id="legend" role="group" aria-label="Categories"></div>
    </div>
  </main>

  <section id="dossier" class="hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="dzName">
    <div id="veil"></div>
    <article id="dossierCard">
      <button id="dzClose" class="icon-btn" type="button" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="dz-scroll">
        <div class="dz-cols">
          <div class="dz-left">
            <div class="dz-item"><span id="dzNum"></span></div>
            <h2 id="dzSym" class="dz-item"></h2>
            <p id="dzName" class="dz-item"></p>
            <span id="dzCat" class="chip dz-item"></span>
            <div class="atom-wrap dz-item"><canvas id="atomCanvas"></canvas></div>
            <ul class="tally dz-item">
              <li><b><i style="background:#ff4d6d;box-shadow:0 0 10px #ff4d6d"></i><span id="cntP"></span></b><span data-t="protons">Protons</span></li>
              <li><b><i style="background:#8ea2c8;box-shadow:0 0 10px #8ea2c8"></i><span id="cntN"></span></b><span data-t="neutrons">Neutrons</span></li>
              <li><b><i style="background:#7dd3fc;box-shadow:0 0 10px #7dd3fc"></i><span id="cntE"></span></b><span data-t="electrons">Electrons</span></li>
            </ul>
          </div>
          <div class="dz-right">
            <dl id="dzStats"></dl>
            <div class="block dz-item"><h3 data-t="config">Electron configuration</h3><code id="dzConfig"></code></div>
            <div class="block dz-item"><h3 data-t="history">Discovery history</h3><p id="dzHistory"></p></div>
            <div class="dz-foot dz-item">
              <button id="dzPrev" class="icon-btn" type="button" aria-label="Previous"><svg class="flip-rtl" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
              <button id="dzNext" class="icon-btn" type="button" aria-label="Next"><svg class="flip-rtl" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </article>
  </section>

  <div class="mark" aria-label="Made by Zhir">Made by <b>Zhir</b></div>

  <div id="fallback"><p>Three.js or GSAP could not be loaded from the CDN.<br>Check your internet connection and reload.</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
/* ==========================================================================
   Orbital Atlas
   sphere lattice  ->  tile lattice, one particle buffer, one shader.
   DOM tiles are the interaction layer; WebGL is the stage they land on.
   ========================================================================== */
(() => {
'use strict';

if (!window.THREE || !window.gsap) {
  document.getElementById('fallback').style.display = 'grid';
  return;
}

/* ---------- small math & dom helpers ---------- */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const TAU = Math.PI * 2;
const GOLDEN = Math.PI * (3 - Math.sqrt(5));

const rafGate = fn => {
  let queued = 0;
  return (...args) => {
    if (queued) return;
    queued = requestAnimationFrame(() => { queued = 0; fn(...args); });
  };
};

const seeded = seed => () => {            // mulberry32
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

/* ---------- families ---------- */
const FAMILY = {
  ak: { hue: '#ff5d73', en: 'Alkali metal',          ku: 'کانزا ئەلکالییەکان' },
  ae: { hue: '#ff9f43', en: 'Alkaline earth metal',  ku: 'کانزا خاکە ئەلکالییەکان' },
  tm: { hue: '#4dabf7', en: 'Transition metal',      ku: 'کانزا گوازراوەکان' },
  pt: { hue: '#8ce99a', en: 'Post-transition metal', ku: 'کانزای دوای گواستنەوە' },
  md: { hue: '#ffd43b', en: 'Metalloid',             ku: 'نیمچەکانزا' },
  nm: { hue: '#38d9a9', en: 'Nonmetal',              ku: 'ناکانزا' },
  hl: { hue: '#da77f2', en: 'Halogen',               ku: 'هالۆجین' },
  ng: { hue: '#a78bfa', en: 'Noble gas',             ku: 'گازە نایابەکان' },

const GASES   = new Set([1, 2, 7, 8, 9, 10, 17, 18, 36, 54, 86]);
const LIQUIDS = new Set([35, 80]);
const hasBracketedMass = z => z === 43 || z === 61 || (z >= 84 && z !== 90 && z !== 91 && z !== 92);

const nuclideMap = NUCLIDE_SHEET.trim().split('\n').map((row, i) => {
  const [sym, en, ku, mass, cat, chi, melt, boil, year, finder] = row.split('|');
  const num = v => (v === '-' ? null : +v);
  const z = i + 1;
  return {
    z, sym, cat,
    name: { en, ku },
    mass: +mass, chi: num(chi), melt: num(melt), boil: num(boil),
    year: +year, finder: finder === '-' ? null : finder,
    phase: z >= 100 ? 'unknown' : GASES.has(z) ? 'gas' : LIQUIDS.has(z) ? 'liquid' : 'solid',
  };
});

/* ---------- table geometry: atomic number -> [column, row] ---------- */
function gridSlot(z) {
  if (z === 1)  return [1, 1];
  if (z === 2)  return [18, 1];
  if (z <= 4)   return [z - 2, 2];
  if (z <= 10)  return [z + 8, 2];
  if (z <= 12)  return [z - 10, 3];
  if (z <= 18)  return [z, 3];
  if (z <= 36)  return [z - 18, 4];
  if (z <= 54)  return [z - 36, 5];
  if (z <= 57)  return [z - 54, 6];
  if (z <= 71)  return [z - 55, 9];      // lanthanide strip
  if (z <= 86)  return [z - 68, 6];
  if (z <= 89)  return [z - 86, 7];
  if (z <= 103) return [z - 87, 10];     // actinide strip
  return [z - 100, 7];
}
const isFBlock = z => (z >= 58 && z <= 71) || (z >= 90 && z <= 103);

/* ---------- procedural electron shells (Madelung + the known rebels) ---------- */
const SUBSHELLS = ['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];
const SUBSHELL_CAP = { s: 2, p: 6, d: 10, f: 14 };
const NOBLE_CORES = [[2, 'He', 0], [10, 'Ne', 2], [18, 'Ar', 4], [36, 'Kr', 7], [54, 'Xe', 10], [86, 'Rn', 14]];
const AZIMUTHAL = { s: 0, p: 1, d: 2, f: 3 };
const SHELL_TWEAKS = {
  24: [['4s','3d',1]], 29: [['4s','3d',1]],
  41: [['5s','4d',1]], 42: [['5s','4d',1]], 44: [['5s','4d',1]], 45: [['5s','4d',1]],
  46: [['5s','4d',2]], 47: [['5s','4d',1]],
  57: [['4f','5d',1]], 58: [['4f','5d',1]], 64: [['4f','5d',1]],
  78: [['6s','5d',1]], 79: [['6s','5d',1]],
  89: [['5f','6d',1]], 90: [['5f','6d',2]], 91: [['5f','6d',1]], 92: [['5f','6d',1]],
  93: [['5f','6d',1]], 96: [['5f','6d',1]], 103: [['6d','7p',1]],
};

function subshellOccupancy(z) {
  const occ = SUBSHELLS.map(() => 0);
  let left = z;
  SUBSHELLS.forEach((sub, i) => {
    const take = Math.min(left, SUBSHELL_CAP[sub[1]]);
    occ[i] = take; left -= take;
  });
  (SHELL_TWEAKS[z] || []).forEach(([from, to, n]) => {
    occ[SUBSHELLS.indexOf(from)] -= n;
    occ[SUBSHELLS.indexOf(to)]   += n;
  });
  return occ;
}

function shellCounts(z) {
  const shells = [];
  subshellOccupancy(z).forEach((v, i) => {
    const n = +SUBSHELLS[i][0];
    shells[n - 1] = (shells[n - 1] || 0) + v;
  });
  return shells.map(v => v || 0);
}

const SUPERSCRIPT = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const toSup = n => String(n).replace(/\d/g, d => SUPERSCRIPT[d]);

function configText(z) {
  const occ = subshellOccupancy(z);
  let coreIdx = -1, coreName = '';
  for (const [zEnd, name, idx] of NOBLE_CORES) if (z > zEnd) { coreIdx = idx; coreName = name; }
  const body = occ
    .map((v, i) => ({ i, v, sub: SUBSHELLS[i] }))
    .filter(s => s.i > coreIdx && s.v > 0)
    .sort((a, b) => (+a.sub[0] - +b.sub[0]) || (AZIMUTHAL[a.sub[1]] - AZIMUTHAL[b.sub[1]]))
    .map(s => s.sub + toSup(s.v));
  return (coreName ? `[${coreName}] ` : '') + body.join(' ');
}

  chip.dataset.cat = key;
  chip.style.setProperty('--c', FAMILY[key].hue);
  chip.innerHTML = '<i></i><span></span>';
  legend.appendChild(chip);
  return chip;
});

/* family spotlight: pure CSS via data-focus + .is-dim, toggled by delegation */
const spotlight = cat => {
  if (!cat) { delete atlasGrid.dataset.focus; tiles.forEach(t => t.el.classList.remove('is-dim')); return; }
  atlasGrid.dataset.focus = cat;
  tiles.forEach(t => t.el.classList.toggle('is-dim', t.rec.cat !== cat));
};
legend.addEventListener('pointerover', e => { const c = e.target.closest('.swatch'); if (c) spotlight(c.dataset.cat); });
legend.addEventListener('pointerleave', () => spotlight(null));
legend.addEventListener('focusin', e => { const c = e.target.closest('.swatch'); if (c) spotlight(c.dataset.cat); });
legend.addEventListener('focusout', () => spotlight(null));

/* ==========================================================================
   WebGL stage
   ========================================================================== */
const FOV = 45, DIST = 7, SPHERE_R = 1.7;
const PER_TILE = 34;
const COUNT = tiles.length * PER_TILE;

const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 200);
camera.position.set(0, 0, DIST);

const uniforms = {
  uMorph: { value: 0 }, uTime: { value: 0 }, uProj: { value: 800 }, uBlur: { value: 0 },
  uFocus: { value: DIST }, uScale: { value: 1 }, uIntro: { value: 0 }, uSpin: { value: new THREE.Matrix3() },
};

const VERT = /* glsl */`
  attribute vec3 aGrid;
  attribute vec3 aSeed;
  attribute vec3 aEarth;
  attribute vec3 aTint;
  attribute float aSize;
  uniform float uMorph, uTime, uProj, uBlur, uFocus, uScale, uIntro;
  uniform mat3 uSpin;
  varying vec3 vCol;
  varying float vAlpha;
  const float PI = 3.14159265;

  void main() {
    float lag = aSeed.x * 0.32;
    float t = clamp((uMorph - lag) / (1.0 - 0.32), 0.0, 1.0);
    float e = t < 0.5 ? 4.0 * t * t * t : 1.0 - pow(-2.0 * t + 2.0, 3.0) / 2.0;
    float burst = sin(PI * t);

    vec3 shell = uSpin * position * uScale * (0.3 + 0.7 * uIntro);
    shell *= 1.0 + 0.018 * sin(uTime * 0.9 + aSeed.y * 6.2831);

    vec3 away  = normalize(shell + 1e-4) * burst * (0.8 + aSeed.z * 2.6);
    vec3 swirl = vec3(sin(aSeed.y * 31.0 + uTime * 1.6),
                      cos(aSeed.x * 27.0 + uTime * 1.3),
                      sin(aSeed.z * 23.0 + uTime)) * 0.35 * burst;
    vec3 slab  = aGrid + vec3(0.0, 0.0, sin(uTime * 0.8 + aSeed.x * 40.0) * 0.015);

    vec3 p = mix(shell, slab, e) + away + swirl;
    vec4 mv = modelViewMatrix * vec4(p, 1.0);

    float off = abs(-mv.z - uFocus);
    float coc = smoothstep(0.2, 2.6, off) * (0.35 + uBlur);
    float facing = smoothstep(-1.0, 1.0, shell.z / max(uScale * 1.7, 0.001));

    vec3 base = mix(aEarth, aTint, e);
    float lit = mix(0.35 + 0.9 * facing, 1.0, e);
    vCol = base * lit * (1.0 + burst * 0.6);
    vAlpha = mix(1.0, 0.5, coc) * (0.55 + 0.45 * lit) * uIntro;

    gl_PointSize = aSize * uProj / -mv.z * (1.0 + coc * 1.6 + burst * 0.5);
    gl_Position = projectionMatrix * mv;
  }`;

const FRAG = /* glsl */`
  varying vec3 vCol;
  varying float vAlpha;
  void main() {
    float d = length(gl_PointCoord - 0.5);
    if (d > 0.5) discard;
    float core = smoothstep(0.5, 0.0, d);
    gl_FragColor = vec4(vCol, vAlpha * core * core * 1.2);
  }`;

/* sphere lattice + earth tint + tile targets */
const geo = new THREE.BufferGeometry();
const A = {
  sphere: new Float32Array(COUNT * 3), grid: new Float32Array(COUNT * 3), seed: new Float32Array(COUNT * 3),
  earth: new Float32Array(COUNT * 3), tint: new Float32Array(COUNT * 3), size: new Float32Array(COUNT),
  local: new Float32Array(COUNT * 2),
};
(() => {
  const rnd = seeded(118);
  const OCEAN = [new THREE.Color('#1d4ed8'), new THREE.Color('#0ea5e9')];
  const LAND  = [new THREE.Color('#34d399'), new THREE.Color('#a3e635')];
  const landMask = (lat, lon) =>
    Math.sin(lon * 2.1 + Math.cos(lat * 3.0) * 1.8) + Math.sin(lat * 4.3 - lon * 1.3) * 0.7 + Math.cos(lon * 3.7 + lat * 2.2) * 0.5 > 0.9;
  const col = new THREE.Color();

  tiles.forEach(({ rec }, ti) => {
    const tint = new THREE.Color(FAMILY[rec.cat].hue);
    for (let p = 0; p < PER_TILE; p++) {
      const i = ti * PER_TILE + p;
      const y = 1 - 2 * (i + 0.5) / COUNT;
      const ring = Math.sqrt(1 - y * y);
      const phi = i * GOLDEN;
      const x = Math.cos(phi) * ring, z = Math.sin(phi) * ring;
      A.sphere.set([x * SPHERE_R, y * SPHERE_R, z * SPHERE_R], i * 3);

      const land = landMask(Math.asin(y), Math.atan2(z, x));
      col.copy((land ? LAND : OCEAN)[rnd() < 0.5 ? 0 : 1]).multiplyScalar(0.7 + rnd() * 0.5);
      A.earth.set([col.r, col.g, col.b], i * 3);
      A.tint.set([tint.r * 0.9, tint.g * 0.9, tint.b * 0.9], i * 3);
      A.seed.set([rnd(), rnd(), rnd()], i * 3);
      A.size[i] = 0.022 + rnd() * 0.03;

      if (p < 14) {                                  // tile outline
        const s = (p / 14) * 4, side = Math.floor(s), f = s - side;
        const [u, v] = [[f, 0], [1, f], [1 - f, 1], [0, 1 - f]][side];
        A.local.set([u, v], i * 2);
      } else {                                       // tile fill
        A.local.set([rnd(), rnd()], i * 2);
      }
    }
  });
})();
geo.setAttribute('position', new THREE.BufferAttribute(A.sphere, 3));
geo.setAttribute('aGrid',  new THREE.BufferAttribute(A.grid, 3).setUsage(THREE.DynamicDrawUsage));
geo.setAttribute('aSeed',  new THREE.BufferAttribute(A.seed, 3));
geo.setAttribute('aEarth', new THREE.BufferAttribute(A.earth, 3));
geo.setAttribute('aTint',  new THREE.BufferAttribute(A.tint, 3));
geo.setAttribute('aSize',  new THREE.BufferAttribute(A.size, 1));

const particles = new THREE.Points(geo, new THREE.ShaderMaterial({
  uniforms, vertexShader: VERT, fragmentShader: FRAG,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
}));
particles.frustumCulled = false;
scene.add(particles);

/* orbital shells: three tilted rings with a satellite each */
const shellRings = new THREE.Group();
const ringSpecs = [
  { r: 2.05, tilt: [0.35, 0, 0.2], speed: 0.55, hue: 0x7dd3fc },
  { r: 2.3,  tilt: [1.1, 0.4, 0],  speed: -0.38, hue: 0xc084fc },
  { r: 2.58, tilt: [-0.5, 0, 0.9], speed: 0.26, hue: 0xf9a8d4 },
];
const rings = ringSpecs.map(spec => {
  const pts = [];
  for (let k = 0; k < 160; k++) pts.push(new THREE.Vector3(Math.cos(k / 160 * TAU) * spec.r, 0, Math.sin(k / 160 * TAU) * spec.r));
  const line = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: spec.hue, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false }));
  const bead = new THREE.Points(
    new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(3), 3)),
    new THREE.PointsMaterial({ color: spec.hue, size: 0.13, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false }));
  const tilt = new THREE.Group();
  tilt.rotation.set(...spec.tilt);
  tilt.add(line, bead);
  shellRings.add(tilt);
  return { spec, line, bead };
});
scene.add(shellRings);

/* distant dust */
const dust = (() => {
  const n = 1400, buf = new Float32Array(n * 3), rnd = seeded(7);
  for (let i = 0; i < n; i++) {
    const r = 14 + rnd() * 30, a = rnd() * TAU, b = Math.acos(2 * rnd() - 1);
    buf.set([r * Math.sin(b) * Math.cos(a), r * Math.cos(b), r * Math.sin(b) * Math.sin(a)], i * 3);
  }
  const g = new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(buf, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ color: 0x9fb4ff, size: 0.07, transparent: true, opacity: 0.7, depthWrite: false }));
  scene.add(pts);
  return pts;
})();

/* ---------- viewport bookkeeping ---------- */
const view = { w: 1, h: 1, halfW: 1, halfH: 1, sphere: 1 };

function fitGrid() {
  const gap = clamp(innerWidth / 320, 3, 6);
  const availW = innerWidth - 32;
  const availH = innerHeight - 72 - 56 - 64;
  const tile = Math.floor(Math.max(42, Math.min((availW - 17 * gap) / 18, (availH - 9 * gap) / 9.3)));
  root.style.setProperty('--tile', tile + 'px');
  root.style.setProperty('--gap', gap + 'px');
  atlasGrid.classList.toggle('compact', tile < 58);
}

/* project every tile rectangle onto the z=0 plane the particles land on */
function retarget() {
  const gridBox = atlasGrid.getBoundingClientRect();
  const out = geo.attributes.aGrid;
  tiles.forEach(({ el }, ti) => {
    const w = el.offsetWidth, h = el.offsetHeight;
    const cx = gridBox.left + el.offsetLeft + w / 2;
    const cy = gridBox.top + el.offsetTop + h / 2;
    for (let p = 0; p < PER_TILE; p++) {
      const i = ti * PER_TILE + p;
      const px = cx + (A.local[i * 2] - 0.5) * w * 0.92;
      const py = cy + (A.local[i * 2 + 1] - 0.5) * h * 0.92;
      out.array[i * 3]     =  (px / view.w * 2 - 1) * view.halfW;
      out.array[i * 3 + 1] = -(py / view.h * 2 - 1) * view.halfH;
      out.array[i * 3 + 2] = 0;
    }
  });
  out.needsUpdate = true;
}
const retargetSoon = rafGate(retarget);

function measure() {
  view.w = innerWidth; view.h = innerHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(view.w, view.h);
  camera.aspect = view.w / view.h;
  camera.updateProjectionMatrix();
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  view.halfH = tanHalf * DIST;
  view.halfW = view.halfH * camera.aspect;
  view.sphere = Math.min(1, (view.halfW * 0.82) / SPHERE_R, (view.halfH * 0.6) / SPHERE_R);
  uniforms.uScale.value = view.sphere;
  uniforms.uProj.value = (view.h * dpr) / (2 * tanHalf);
  shellRings.scale.setScalar(view.sphere);
  fitGrid();
  retarget();
}
addEventListener('resize', rafGate(measure));
$('#stage').addEventListener('scroll', retargetSoon, { passive: true });

/* ---------- globe interaction ---------- */
const Phase = { now: 'globe' };
const spin = { x: 0.25, y: 0, vy: 0.0016, ambient: 0.0016 };
const pointer = { x: 0, y: 0, sx: 0, sy: 0 };
const drag = { on: false, x: 0, y: 0, travel: 0 };
const spinEuler = new THREE.Euler(), spinM4 = new THREE.Matrix4();

const insideSphere = e => {
  const r = view.sphere * SPHERE_R * uniforms.uProj.value / (DIST * Math.min(devicePixelRatio || 1, 2));
  return Math.hypot(e.clientX - view.w / 2, e.clientY - view.h / 2) < r * 1.12;
};

canvas.addEventListener('pointerdown', e => {
  if (Phase.now !== 'globe') return;
  drag.on = true; drag.x = e.clientX; drag.y = e.clientY; drag.travel = 0;
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('pointermove', e => {
  if (!drag.on) { canvas.style.cursor = Phase.now === 'globe' && insideSphere(e) ? 'pointer' : 'grab'; return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY; drag.travel += Math.abs(dx) + Math.abs(dy);
  spin.y += dx * 0.0055; spin.vy = dx * 0.0055;
  spin.x = clamp(spin.x + dy * 0.0055, -1.1, 1.1);
});
canvas.addEventListener('pointerup', e => {
  if (!drag.on) return;
  drag.on = false; canvas.style.cursor = 'grab';
  if (drag.travel < 7 && insideSphere(e)) unfold();
});
addEventListener('pointermove', e => { pointer.x = e.clientX / view.w - 0.5; pointer.y = e.clientY / view.h - 0.5; }, { passive: true });

/* ---------- render loop ---------- */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  uniforms.uTime.value = t;

  if (!drag.on) { spin.vy += (spin.ambient - spin.vy) * 0.04; spin.y += spin.vy * dt * 60; }
  spinM4.makeRotationFromEuler(spinEuler.set(spin.x, spin.y, 0));
  uniforms.uSpin.value.setFromMatrix4(spinM4);

  shellRings.rotation.set(spin.x, spin.y, 0);
  const fade = clamp(1 - uniforms.uMorph.value * 1.6, 0, 1) * uniforms.uIntro.value;
  shellRings.visible = fade > 0.01;
  rings.forEach(({ spec, line, bead }) => {
    const a = t * spec.speed;
    const p = bead.geometry.attributes.position;
    p.array[0] = Math.cos(a) * spec.r; p.array[2] = Math.sin(a) * spec.r; p.needsUpdate = true;
    line.material.opacity = 0.22 * fade; bead.material.opacity = fade;
  });

  pointer.sx += (pointer.x - pointer.sx) * 0.05; pointer.sy += (pointer.y - pointer.sy) * 0.05;
  dust.rotation.y = t * 0.008 + pointer.sx * 0.12;
  dust.rotation.x = pointer.sy * 0.08;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ==========================================================================
   Phase transitions
   ========================================================================== */
const pageRoot = document.body;

function unfold() {
  if (Phase.now !== 'globe') return;
  Phase.now = 'moving'; pageRoot.dataset.phase = 'moving';
  canvas.style.cursor = 'default';
  fitGrid(); retarget();
  gsap.timeline({ onComplete: () => { Phase.now = 'table'; pageRoot.dataset.phase = 'table'; } })
    .to(uniforms.uMorph, { value: 1, duration: 3.1, ease: 'none' }, 0)
    .to(uniforms.uBlur, { value: 1, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0)
    .to('#hint', { autoAlpha: 0, y: 16, duration: 0.5, ease: 'power2.in' }, 0)
    .to('#tableChrome', { autoAlpha: 1, duration: 0.8 }, 2.2)
    .to(tileEls, { autoAlpha: 1, scale: 1, y: 0, duration: 0.8, ease: 'back.out(1.5)', stagger: { amount: 1, from: 'start' } }, 1.9)
    .to('#legend', { autoAlpha: 1, duration: 0.8 }, 2.6);
}

function fold() {
  if (Phase.now !== 'table') return;
  Phase.now = 'moving'; pageRoot.dataset.phase = 'moving';
  spotlight(null);
  gsap.timeline({ onComplete: () => { Phase.now = 'globe'; pageRoot.dataset.phase = 'globe'; canvas.style.cursor = 'grab'; } })
    .to(tileEls, { autoAlpha: 0, scale: 0.5, y: 14, duration: 0.45, ease: 'power2.in', stagger: { amount: 0.35, from: 'end' } }, 0)
    .to(['#legend', '#tableChrome'], { autoAlpha: 0, duration: 0.4 }, 0)
    .to(uniforms.uMorph, { value: 0, duration: 2.6, ease: 'none' }, 0.25)
    .to(uniforms.uBlur, { value: 1, duration: 1.3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.25)
    .to('#hint', { autoAlpha: 1, y: 0, duration: 0.8 }, 2.2);
}

$('#expandBtn').addEventListener('click', unfold);
$('#foldBtn').addEventListener('click', fold);

/* ==========================================================================
   Bohr stage: nucleus sprite baked once per element, electrons on tilted orbits
   ========================================================================== */
class BohrStage {
  constructor(cv) {
    this.cv = cv; this.ctx = cv.getContext('2d'); this.raf = 0; this.last = 0;
    this.sparks = Array.from({ length: 42 }, () => ({ x: Math.random(), y: Math.random(), v: 0.012 + Math.random() * 0.04, r: 0.6 + Math.random() * 1.5, a: Math.random() }));
    new ResizeObserver(() => this.fit()).observe(cv.parentElement);
  }
  fit() {
    const box = this.cv.parentElement.getBoundingClientRect();
    if (!box.width) return;
    this.d = Math.min(devicePixelRatio || 1, 2);
    this.w = box.width; this.h = box.height;
    this.cv.width = Math.round(box.width * this.d); this.cv.height = Math.round(box.height * this.d);
    if (this.rec) this.layout();
  }
  load(rec, hue) {
    this.rec = rec; this.hue = hue;
    this.shells = shellCounts(rec.z);
    this.neutrons = Math.max(0, Math.round(rec.mass) - rec.z);
    this.layout();
  }
  layout() {
    const a = this.rec.z + this.neutrons;
    const half = Math.min(this.w, this.h) / 2;
    const outer = half * 0.9;
    this.half = half;
    this.nucR = clamp(5 + Math.cbrt(a) * 2.2, 8, outer * 0.3);
    const n = this.shells.length, first = this.nucR + 18;
    this.radii = n === 1 ? [Math.max(first, outer * 0.55)] : this.shells.map((_, i) => first + (outer - first) * i / (n - 1));
    this.bakeNucleus(a);
  }
  bakeNucleus(a) {
    const d = this.d, R = this.nucR, pad = 12, mid = R + pad;
    const sprite = document.createElement('canvas');
    sprite.width = sprite.height = Math.ceil(mid * 2 * d);
    const g = sprite.getContext('2d');
    g.scale(d, d);
    const halo = g.createRadialGradient(mid, mid, 0, mid, mid, mid);
    halo.addColorStop(0, this.hue + '77'); halo.addColorStop(1, this.hue + '00');
    g.fillStyle = halo; g.fillRect(0, 0, mid * 2, mid * 2);

    const rnd = seeded(this.rec.z * 977 + 13);
    const kinds = [...Array(this.rec.z).fill(1), ...Array(this.neutrons).fill(0)];
    for (let i = kinds.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }

    const rn = Math.max(1.4, R / Math.cbrt(a) * 0.78), span = R - rn;
    const balls = kinds.map((k, i) => {
      const f = Math.cbrt((i + 0.5) / a), y = 1 - 2 * (i + 0.5) / a, ring = Math.sqrt(1 - y * y), ph = i * GOLDEN;
      return { x: Math.cos(ph) * ring * f * span, y: y * f * span, z: Math.sin(ph) * ring * f * span, k };
    }).sort((p, q) => p.z - q.z);

    balls.forEach(b => {
      const px = mid + b.x, py = mid + b.y;
      const gr = g.createRadialGradient(px - rn * 0.3, py - rn * 0.3, rn * 0.1, px, py, rn);
      if (b.k) { gr.addColorStop(0, '#ffd0d9'); gr.addColorStop(0.45, '#ff4d6d'); gr.addColorStop(1, '#b3123a'); }
      else     { gr.addColorStop(0, '#e3eaff'); gr.addColorStop(0.45, '#7f93c9'); gr.addColorStop(1, '#3b4a7a'); }
      g.fillStyle = gr; g.beginPath(); g.arc(px, py, rn, 0, TAU); g.fill();
    });
    this.nucleus = { sprite, size: mid * 2 };
  }
  play() {
    if (this.raf) return;
    const tick = ms => { this.draw(ms / 1000); this.raf = requestAnimationFrame(tick); };
    this.raf = requestAnimationFrame(tick);
  }
  halt() { cancelAnimationFrame(this.raf); this.raf = 0; }

  draw(t) {
    if (!this.nucleus) return;
    const { ctx, w, h, d, half } = this;
    const dt = Math.min(t - (this.last || t), 0.05); this.last = t;
    ctx.setTransform(d, 0, 0, d, 0, 0);
    ctx.clearRect(0, 0, w, h);

    ctx.fillStyle = this.hue;
    this.sparks.forEach(s => {
      s.y -= s.v * dt; if (s.y < 0) { s.y = 1; s.x = Math.random(); }
      ctx.globalAlpha = 0.08 + 0.22 * Math.abs(Math.sin(t * 0.7 + s.a * 9));
      ctx.beginPath(); ctx.arc(s.x * w, s.y * h, s.r, 0, TAU); ctx.fill();
    });
    ctx.globalAlpha = 1;

    const mx = w / 2, my = h / 2;
    const yaw = t * 0.28, pit = 0.95;
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pit), sp = Math.sin(pit);
    const eRad = clamp(half * 0.028, 2, 4.2);
    const bodies = [];

    this.shells.forEach((count, k) => {
      const r = this.radii[k], tilt = 0.35 + k * 0.58, roll = k * 1.17;
      const ct = Math.cos(tilt), st = Math.sin(tilt), cr = Math.cos(roll), sr = Math.sin(roll);
      const project = (x, y, z) => {
        const y1 = y * ct - z * st, z1 = y * st + z * ct;
        const x2 = x * cr - y1 * sr, y2 = x * sr + y1 * cr;
        const x3 = x2 * cy + z1 * sy, z3 = -x2 * sy + z1 * cy;
        const y4 = y2 * cp - z3 * sp, z4 = y2 * sp + z3 * cp;
        const persp = 1 / (1 - z4 / (half * 5));
        return [mx + x3 * persp, my + y4 * persp, z4, persp];
      };
      ctx.beginPath();
      for (let s = 0; s <= 72; s++) {
        const a = s / 72 * TAU, [px, py] = project(Math.cos(a) * r, 0, Math.sin(a) * r);
        s ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.strokeStyle = 'rgba(190, 210, 255, .16)'; ctx.lineWidth = 1; ctx.stroke();

      const omega = 1.5 / Math.pow(k + 1, 0.85) * (k % 2 ? -1 : 1);
      for (let j = 0; j < count; j++) {
        const a = t * omega + j * TAU / count + k;
        const [px, py, z, persp] = project(Math.cos(a) * r, 0, Math.sin(a) * r);
        bodies.push({ px, py, z, persp, e: true });
      }
    });
    bodies.push({ px: mx, py: my, z: 0, e: false });
    bodies.sort((p, q) => p.z - q.z);

    const pulse = 1 + 0.02 * Math.sin(t * 3);
    bodies.forEach(b => {
      if (!b.e) {
        const s = this.nucleus.size * pulse;
        ctx.drawImage(this.nucleus.sprite, b.px - s / 2, b.py - s / 2, s, s);
        return;
      }
      const rr = eRad * b.persp;
      ctx.fillStyle = 'rgba(125, 211, 252, .18)';
      ctx.beginPath(); ctx.arc(b.px, b.py, rr * 2.7, 0, TAU); ctx.fill();
      ctx.fillStyle = '#b6ecff';
      ctx.beginPath(); ctx.arc(b.px, b.py, rr, 0, TAU); ctx.fill();
    });
  }
}

/* ==========================================================================
   Dossier (element modal)
   ========================================================================== */
const Dossier = (() => {
  const shell = $('#dossier'), card = $('#dossierCard'), veil = $('#veil');
  const atom = new BohrStage($('#atomCanvas'));
  let z = 1, origin = null, isOpen = false;

  const tempText = k => {
    if (k == null) return '—';
    const kelvin = +k.toFixed(2), celsius = +(k - 273.15).toFixed(1);
    return `${Locale.digits(kelvin)} K · ${Locale.digits(celsius)} °C`;
  };
  const stats = [
    ['num',    r => Locale.digits(r.z)],
    ['mass',   r => (hasBracketedMass(r.z) ? `(${Locale.digits(r.mass)})` : Locale.digits(r.mass)) + ' u'],
    ['cat',    r => FAMILY[r.cat][Locale.code]],
    ['phase',  r => Locale.lex.phases[r.phase]],
    ['chi',    r => (r.chi == null ? '—' : Locale.digits(r.chi))],
    ['group',  r => (isFBlock(r.z) ? '—' : Locale.digits(gridSlot(r.z)[0]))],
    ['period', r => { const row = gridSlot(r.z)[1]; return Locale.digits(row > 8 ? row - 3 : row); }],
    ['melt',   r => tempText(r.melt)],
    ['boil',   r => tempText(r.boil)],
  ];
  const statHost = $('#dzStats');
  const statNodes = stats.map(([key]) => {
    const wrap = document.createElement('div');
    wrap.className = 'stat dz-item';
    wrap.innerHTML = `<dt data-t="${key}"></dt><dd></dd>`;
    statHost.appendChild(wrap);
    return wrap.lastChild;
  });

  function paint() {
    const rec = nuclideMap[z - 1], fam = FAMILY[rec.cat], lex = Locale.lex;
    card.style.setProperty('--c', fam.hue);
    $('#dzNum').textContent = Locale.digits(rec.z);
    $('#dzSym').textContent = rec.sym;
    $('#dzName').textContent = Locale.nameOf(rec);
    $('#dzCat').textContent = fam[Locale.code];
    stats.forEach(([, fn], i) => { statNodes[i].textContent = fn(rec); });
    $('#dzConfig').textContent = configText(rec.z);
    $('#dzHistory').textContent = rec.year ? lex.found(Locale.digits(rec.year), rec.finder) : lex.antiquity;
    $('#cntP').textContent = Locale.digits(rec.z);
    $('#cntN').textContent = Locale.digits(Math.max(0, Math.round(rec.mass) - rec.z));
    $('#cntE').textContent = Locale.digits(rec.z);
    $('#dzClose').setAttribute('aria-label', lex.close);
    $('#dzPrev').setAttribute('aria-label', lex.prev);
    $('#dzNext').setAttribute('aria-label', lex.next);
    if (atom.rec !== rec) { atom.fit(); atom.load(rec, fam.hue); }
  }

  function open(n, from) {
    if (isOpen) return;
    z = n; origin = from; isOpen = true;
    shell.classList.remove('hidden'); shell.setAttribute('aria-hidden', 'false');
    gsap.set(card, { clearProps: 'all' });
    atom.rec = null;
    paint();
    atom.play();
    const a = from.getBoundingClientRect(), b = card.getBoundingClientRect();
    gsap.fromTo(veil, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45 });
    gsap.fromTo(card,
      { x: a.left + a.width / 2 - (b.left + b.width / 2), y: a.top + a.height / 2 - (b.top + b.height / 2), scale: Math.max(0.08, a.width / b.width), autoAlpha: 0 },
      { x: 0, y: 0, scale: 1, autoAlpha: 1, duration: 0.85, ease: 'expo.out' });
    gsap.from('.dz-item', { y: 14, autoAlpha: 0, duration: 0.55, ease: 'power3.out', stagger: 0.035, delay: 0.2 });
    $('#dzClose').focus({ preventScroll: true });
  }

  function close() {
    if (!isOpen) return;
    isOpen = false;
    const a = origin && origin.isConnected && Phase.now === 'table' ? origin.getBoundingClientRect() : null;
    const b = card.getBoundingClientRect();
    const finish = () => {
      shell.classList.add('hidden'); shell.setAttribute('aria-hidden', 'true');
      atom.halt(); gsap.set(card, { clearProps: 'all' });
      if (origin) origin.focus({ preventScroll: true });
    };
    gsap.to(veil, { autoAlpha: 0, duration: 0.4 });
    gsap.to(card, a
      ? { x: a.left + a.width / 2 - (b.left + b.width / 2), y: a.top + a.height / 2 - (b.top + b.height / 2), scale: Math.max(0.08, a.width / b.width), autoAlpha: 0, duration: 0.55, ease: 'expo.in', onComplete: finish }
      : { y: 24, autoAlpha: 0, duration: 0.3, onComplete: finish });
  }

  function step(delta) {
    if (!isOpen) return;
    z = ((z - 1 + delta + nuclideMap.length) % nuclideMap.length) + 1;
    origin = tiles[z - 1].el;
    paint();
    gsap.fromTo('.dz-item', { y: 10, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: 'power3.out', stagger: 0.02 });
  }

  $('#dzClose').addEventListener('click', close);
  veil.addEventListener('click', close);
  $('#dzPrev').addEventListener('click', () => step(-1));
  $('#dzNext').addEventListener('click', () => step(1));
  addEventListener('keydown', e => {
    if (!isOpen) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });

  return { open, close, refresh: () => { if (isOpen) paint(); }, get isOpen() { return isOpen; } };
})();

atlasGrid.addEventListener('click', e => {
  const tile = e.target.closest('.tile');
  if (tile && Phase.now === 'table') Dossier.open(+tile.dataset.z, tile);
});

/* ==========================================================================
   Search
   ========================================================================== */
const searchInput = $('#searchInput');
const matches = () => {
  const needle = searchInput.value.trim().toLowerCase();
  return tiles.filter(({ rec }) => !needle || [rec.sym, rec.name.en, rec.name.ku, rec.z].join(' ').toLowerCase().includes(needle));
};
searchInput.addEventListener('input', rafGate(() => {
  const hit = new Set(matches());
  const active = searchInput.value.trim() !== '';
  tiles.forEach(t => t.el.classList.toggle('is-miss', active && !hit.has(t)));
}));
searchInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const [first] = matches();
  if (first && searchInput.value.trim()) Dossier.open(first.rec.z, first.el);
});

/* ==========================================================================
   Language
   ========================================================================== */
const langSwitch = $('#langSwitch');

function setLocale(code) {
  Locale.code = code;
  const lex = Lexicon[code];
  root.lang = code === 'ku' ? 'ckb' : 'en';
  root.dir = code === 'ku' ? 'rtl' : 'ltr';
  document.title = lex.pageTitle;
  langSwitch.dataset.lang = code;
  $$('button', langSwitch).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.set === code)));

  $$('[data-t]').forEach(n => { const v = lex[n.dataset.t]; if (typeof v === 'string') n.textContent = v; });
  $$('[data-tp]').forEach(n => { n.placeholder = lex[n.dataset.tp]; });

  tiles.forEach(({ el, rec, tz, tn }) => {
    tz.textContent = Locale.digits(rec.z);
    tn.textContent = Locale.nameOf(rec);
    el.setAttribute('aria-label', `${Locale.nameOf(rec)}, ${lex.num} ${Locale.digits(rec.z)}`);
  });
  legendChips.forEach(chip => { chip.lastChild.textContent = FAMILY[chip.dataset.cat][code]; });
  $('#foldBtn').title = lex.fold;
  Dossier.refresh();
}
langSwitch.addEventListener('click', e => {
  const b = e.target.closest('button[data-set]');
  if (b && b.dataset.set !== Locale.code) setLocale(b.dataset.set);
});

/* ==========================================================================
   Ignition
   ========================================================================== */
if (matchMedia('(prefers-reduced-motion: reduce)').matches) gsap.globalTimeline.timeScale(2.5);

gsap.set(tileEls, { autoAlpha: 0, scale: 0.5, y: 14 });
setLocale('en');
measure();
requestAnimationFrame(frame);

gsap.fromTo(uniforms.uIntro, { value: 0 }, { value: 1, duration: 2.6, ease: 'expo.out' });
gsap.from('#chrome', { y: -24, autoAlpha: 0, duration: 1, ease: 'power3.out', delay: 0.3 });
gsap.from('#hint', { y: 22, autoAlpha: 0, duration: 1.1, ease: 'power3.out', delay: 1.1 });

if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitGrid(); retarget(); });
})();
</script>
</body>
